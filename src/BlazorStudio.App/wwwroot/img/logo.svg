<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Blazor Studio: Terminal-Fenster mit Prompt „>B_“ -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#1C2233"/>
      <stop offset="1" stop-color="#0C0F16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.6" cy="0.64" r="0.55">
      <stop offset="0" stop-color="#2F5BFF" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#2F5BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE8FF"/>
    </linearGradient>
    <linearGradient id="chev" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FD0FF"/>
      <stop offset="1" stop-color="#14A3E6"/>
    </linearGradient>
    <!-- Buchstabe B: Stamm + zwei Bögen, Innenräume ausgestanzt -->
    <mask id="b" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <g transform="translate(108 96) scale(0.5) translate(-58 -40)">
        <rect x="58" y="40" width="48" height="176" rx="12" fill="#fff"/>
        <rect x="58" y="40" width="124" height="88" rx="44" fill="#fff"/>
        <rect x="58" y="116" width="140" height="100" rx="50" fill="#fff"/>
        <rect x="84" y="40" width="50" height="176" fill="#fff"/>
        <rect x="106" y="76" width="36" height="16" rx="8" fill="#000"/>
        <rect x="106" y="148" width="48" height="32" rx="16" fill="#000"/>
      </g>
    </mask>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#glow)"/>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#shine)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="58.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="3"/>

  <!-- Titelleiste -->
  <circle cx="56" cy="54" r="10" fill="#FF5F57"/>
  <circle cx="84" cy="54" r="10" fill="#FEBC2E"/>
  <circle cx="112" cy="54" r="10" fill="#28C840"/>
  <rect x="32" y="80" width="192" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.07"/>

  <!-- Prompt: >B_ -->
  <polyline points="50,118 86,145 50,172" fill="none" stroke="url(#chev)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="100" y="90" width="90" height="100" fill="url(#glyph)" mask="url(#b)"/>
  <rect x="188" y="170" width="36" height="16" rx="4" fill="#4C8DFF"/>
</svg>
