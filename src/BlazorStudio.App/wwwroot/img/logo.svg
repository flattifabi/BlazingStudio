<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="0.5" stop-color="#2F5BFF"/>
      <stop offset="1" stop-color="#14B8E6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#9BE7FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9BE7FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3EEFF"/>
    </linearGradient>
    <!-- Buchstabe B: Stamm + zwei Bögen, Innenräume ausgestanzt -->
    <mask id="b">
      <rect x="70" y="52" width="38" height="152" rx="10" fill="#fff"/>
      <rect x="70" y="52" width="104" height="74" rx="37" fill="#fff"/>
      <rect x="70" y="116" width="118" height="88" rx="44" fill="#fff"/>
      <rect x="90" y="52" width="40" height="152" fill="#fff"/>
      <rect x="108" y="82" width="34" height="14" rx="7" fill="#000"/>
      <rect x="108" y="146" width="46" height="28" rx="14" fill="#000"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0A1F66" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#glow)"/>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#shine)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="58.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="60" y="40" width="140" height="176" fill="url(#glyph)" mask="url(#b)"/>
  </g>

  <!-- Funke: „Studio“ / Design -->
  <path d="M203 46 C205 60 210 65 224 67 C210 69 205 74 203 88 C201 74 196 69 182 67 C196 65 201 60 203 46 Z" fill="#FFFFFF"/>
  <circle cx="186" cy="96" r="5" fill="#FFFFFF" fill-opacity="0.75"/>
</svg>
